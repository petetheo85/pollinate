<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pollinate</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --card-subtle: #21262d;
      --border: #30363d;
      --border-accent: #f59e0b;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --accent-soft: rgba(245, 158, 11, 0.12);
      --btn-secondary: #21262d;
      --btn-secondary-hover: #30363d;
      --success: #3fb950;
      --success-soft: rgba(63, 185, 80, 0.15);
      --warning: #d29922;
      --warning-soft: rgba(210, 153, 34, 0.15);
      --error: #f85149;
      --error-soft: rgba(248, 81, 73, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: url('icons/icon48.png') no-repeat center / contain;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .top-bar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .settings-btn:hover {
      color: var(--text);
    }

    /* States */
    .view-state {
      display: none;
    }

    .view-state.active {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Idle / Welcome View */
    #view-idle {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
      gap: 12px;
      color: var(--text-muted);
    }

    .idle-icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .idle-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .idle-desc {
      font-size: 13px;
      line-height: 1.5;
      max-width: 260px;
    }

    /* Loading View */
    #view-loading {
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 16px;
      gap: 16px;
    }

    /* Bee & Pollen Animation */
    .hive-scene {
      position: relative;
      width: 140px;
      height: 80px;
      margin: 0 auto 4px;
    }

    .bee-actor {
      position: absolute;
      font-size: 26px;
      user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .bee-1 {
      top: 25px;
      left: 15px;
      animation: beeHover1 2.4s ease-in-out infinite alternate;
    }

    .bee-2 {
      top: 15px;
      right: 15px;
      animation: beeHover2 2.7s ease-in-out infinite alternate;
    }

    @keyframes beeHover1 {
      0% { transform: translate(0, 0) rotate(-6deg); }
      50% { transform: translate(30px, -14px) rotate(10deg); }
      100% { transform: translate(55px, 8px) rotate(-4deg); }
    }

    @keyframes beeHover2 {
      0% { transform: translate(0, 0) scaleX(-1) rotate(6deg); }
      50% { transform: translate(-25px, 16px) scaleX(-1) rotate(-8deg); }
      100% { transform: translate(-50px, -6px) scaleX(-1) rotate(4deg); }
    }

    .pollen-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pollen {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fef08a 20%, #f59e0b 90%);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.8);
    }

    .p1 { width: 6px; height: 6px; top: 35px; left: 35px; animation: pollenDrift 1.8s ease-in-out infinite; }
    .p2 { width: 5px; height: 5px; top: 50px; left: 70px; animation: pollenDrift 2.3s ease-in-out infinite 0.4s; }
    .p3 { width: 7px; height: 7px; top: 20px; left: 95px; animation: pollenDrift 1.9s ease-in-out infinite 0.8s; }
    .p4 { width: 4px; height: 4px; top: 60px; left: 25px; animation: pollenDrift 2.1s ease-in-out infinite 0.2s; }
    .p5 { width: 5px; height: 5px; top: 40px; left: 110px; animation: pollenDrift 2.5s ease-in-out infinite 0.6s; }

    @keyframes pollenDrift {
      0% { transform: translateY(0) scale(0.6); opacity: 0.2; }
      50% { transform: translateY(-16px) scale(1.1); opacity: 0.95; }
      100% { transform: translateY(-32px) scale(0.5); opacity: 0; }
    }

    .loading-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }

    .loading-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .guidance-input {
      width: 100%;
      padding: 8px 10px;
      background-color: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .guidance-input:focus {
      border-color: var(--accent);
    }

    /* Error View */
    #view-error {
      background-color: var(--error-soft);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
      padding: 16px;
      color: var(--error);
      gap: 10px;
    }

    /* Content View */
    #view-content {
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .author-name-input {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 2px 4px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .author-name-input:hover {
      border-color: var(--border);
      background-color: var(--card-subtle);
    }

    .author-name-input:focus {
      border-color: var(--accent);
      background-color: var(--card-subtle);
    }

    .author-headline {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .score-pills {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: var(--card-subtle);
      border: 1px solid var(--border);
    }

    .pill-accent {
      background-color: var(--accent-soft);
      border-color: rgba(245, 158, 11, 0.4);
      color: var(--accent);
    }

    .pill-success {
      background-color: var(--success-soft);
      border-color: rgba(63, 185, 80, 0.4);
      color: var(--success);
    }

    .reason-box {
      font-size: 12px;
      color: var(--text);
      margin-top: 10px;
      padding: 8px 10px;
      background-color: var(--card-subtle);
      border-left: 3px solid var(--accent);
      border-radius: 0 4px 4px 0;
    }

    /* Warning Banner */
    .banner {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      display: none;
    }

    .banner.warning {
      display: block;
      background-color: var(--warning-soft);
      border: 1px solid rgba(210, 153, 34, 0.4);
      color: var(--warning);
    }

    /* Drafts Tabs */
    .tabs-header {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: capitalize;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background-color: var(--card-subtle);
      color: var(--accent);
    }

    .draft-insight {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .draft-insight strong {
      color: var(--accent);
    }

    textarea.draft-editor {
      width: 100%;
      min-height: 140px;
      background-color: #0b0e14;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      line-height: 1.6;
      padding: 10px 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease;
    }

    textarea.draft-editor:focus {
      border-color: var(--accent);
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button.btn {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000;
      flex: 1;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-success {
      background-color: var(--success);
      color: #fff;
      flex: 1;
    }

    .btn-success:hover {
      background-color: #2ea043;
    }

    .btn-secondary {
      background-color: var(--btn-secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--btn-secondary-hover);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--error);
      border: 1px solid rgba(248, 81, 73, 0.4);
    }

    .btn-danger:hover {
      background-color: var(--error-soft);
    }

    /* Refine & Regenerate Card */
    .refine-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .refine-actions {
      display: flex;
      gap: 8px;
    }

    .btn-secondary-accent {
      background-color: var(--card-subtle);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--accent);
      flex: 1.5;
    }

    .btn-secondary-accent:hover {
      background-color: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="top-bar">
    <div class="brand">
      <div class="brand-icon"></div>
      <span class="brand-title">Pollinate</span>
    </div>
    <div class="top-bar-actions">
      <button id="btn-clear" class="settings-btn" title="Clear Post" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <button id="open-dashboard" class="settings-btn" title="Open Dashboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      </button>
      <button id="open-settings" class="settings-btn" title="Options">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Idle State -->
  <div id="view-idle" class="view-state active">
    <div class="idle-icon">🐝</div>
    <div class="idle-title">Ready to Pollinate</div>
    <div class="idle-desc">
      Highlight a LinkedIn post and visible comments, right-click, and select <strong>"Pollinate"</strong>.
    </div>
  </div>

  <!-- Loading State -->
  <div id="view-loading" class="view-state">
    <div class="hive-scene">
      <div class="pollen-field">
        <span class="pollen p1"></span>
        <span class="pollen p2"></span>
        <span class="pollen p3"></span>
        <span class="pollen p4"></span>
        <span class="pollen p5"></span>
      </div>
      <div class="bee-actor bee-1">🐝</div>
      <div class="bee-actor bee-2">🐝</div>
    </div>
    <div class="loading-title">🐝 Bees are buzzing... <em>*buzz buzz buzz*</em></div>
    <div id="loading-buzz-step" class="loading-desc">Harvesting...</div>
  </div>

  <!-- Error State -->
  <div id="view-error" class="view-state">
    <div id="error-message">An error occurred.</div>
    <button id="btn-retry" class="btn btn-secondary" style="margin-top: 8px;">Dismiss</button>
  </div>

  <!-- Main Content State -->
  <div id="view-content" class="view-state">
    <!-- Duplicate Warning Banner -->
    <div id="duplicate-banner" class="banner warning"></div>

    <!-- Card 1: Post Metadata -->
    <div class="card">
      <input type="text" id="post-author-input" class="author-name-input" placeholder="Author Name" title="Click to edit author name">
      <div id="post-headline" class="author-headline"></div>
      <div class="score-pills">
        <span id="pill-relevance" class="pill pill-accent" title="Relevance (1-10): Alignment between this post and your expertise in context/profile.md"></span>
        <span id="pill-opportunity" class="pill pill-success" title="Opportunity (1-10): Strategic value for thoughtful conversation and engagement"></span>
        <span id="pill-interaction" class="pill" style="display: none;" title="Prior interactions with this author"></span>
      </div>
      <div id="post-reason" class="reason-box"></div>
    </div>

    <!-- Card 2: Drafts -->
    <div class="card" style="flex: 1; display: flex; flex-direction: column;">
      <div class="tabs-header" id="tabs-container"></div>
      <div class="draft-insight" id="draft-insight"></div>
      <textarea id="draft-text" class="draft-editor"></textarea>
      
      <div class="btn-row">
        <button id="btn-copy" class="btn btn-primary">Copy to Clipboard</button>
        <button id="btn-mark-posted" class="btn btn-success">Mark as Posted</button>
      </div>
    </div>

    <!-- Card 3: Refine & Regenerate -->
    <div class="card refine-card">
      <div class="card-section-title">Refine & Regenerate</div>
      <input type="text" id="regen-guidance-input" class="guidance-input" maxlength="500" placeholder="Custom steering (e.g. focus on latency, candid)...">
      <div class="refine-actions">
        <button id="btn-simplify" class="btn btn-secondary" title="Regenerate with simpler, punchier phrasing">Simplify</button>
        <button id="btn-regenerate" class="btn btn-secondary-accent">Regenerate</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
